source [find interface/stlink-dap.cfg]
transport select dapdirect_swd
source [find target/swj-dp.tcl]

adapter speed 100

swj_newdap stm32f4x cpu -irlen 4 -ircapture 0x1 -irmask 0xf -expected-id 0
dap create stm32f4x.dap -chain-position stm32f4x.cpu

proc sysreset {} {
    # Power up the DP
    dap dpreg 0x4 0x50000000
    sleep 20
    set cs [dap dpreg 0x4]
    puts "CTRL/STAT after power-up: $cs"

    # Assert SYSRESETREQ
    dap dpreg 0x4 0x50000004
    puts "SYSRESETREQ asserted"

    sleep 100

    # De-assert SYSRESETREQ
    dap dpreg 0x4 0x50000000
    puts "SYSRESETREQ de-asserted"

    sleep 200
}

target create stm32f4x.cpu cortex_m -endian little -dap stm32f4x.dap
